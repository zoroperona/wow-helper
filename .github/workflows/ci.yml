name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  node:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: loot-allocator
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: loot-allocator/package-lock.json
      - run: npm ci
      - run: npm run ci:pages-safety
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  dotnet:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: wow-db
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore WowDb.slnx
      - run: dotnet test WowDb.slnx -c Release --no-restore
      - run: dotnet build WowDb.slnx -c Release --no-restore
